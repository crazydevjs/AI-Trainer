name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
      JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET_TEST }}
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Sync test database schema
        # `db push` (not `migrate deploy`) — this project has no
        # `prisma/migrations` history, it has always used schema-sync
        # (see CHANGELOG Phase 15). DATABASE_URL_TEST must point at a
        # dedicated test database/branch, never a real one — this
        # command overwrites its schema on every run.
        run: npx prisma db push --accept-data-loss

      - name: Seed exercise library
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_E2E_TEST: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
